<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lipina 🌲</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>
    <div class="dark-overlay"></div>

    <main class="container">

        <div class="top">
            <div class="small-title">SOBOTNÍ PLÁN</div>

            <h1>
                Půjdeme v sobotu<br>
                <span>skákat na Lipinu?</span>
            </h1>

            <p>Tak co, jdeš do toho?</p>
        </div>

        <div class="buttons" id="buttons">

            <button class="yes" id="yesButton">
                <span>✓</span> Ano
            </button>

            <button class="no" id="noButton">
                Ne
            </button>

        </div>

        <section class="form-box hidden" id="formBox">

            <div class="check">✓</div>

            <h2>Tak jo! 🚲</h2>
            <p>Napiš mi tvoje jméno a čas.</p>

            <form
                id="answerForm"
                action="https://formspree.io/f/xkjndbkb"
                method="POST"
            >

                <input type="hidden" name="odpoved" value="Ano">

                <label>
                    Jméno
                    <input
                        type="text"
                        name="jmeno"
                        placeholder="Tvoje jméno"
                        maxlength="50"
                        required
                    >
                </label>

                <label>
                    Čas
                    <input
                        type="time"
                        name="cas"
                        required
                    >
                </label>

                <button class="submit" type="submit">
                    Odeslat odpověď →
                </button>

                <div id="status"></div>

            </form>

        </section>

        <div class="bottom">
            🚲 &nbsp; LIPINA &nbsp; 🚲
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
